            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

tomy/RID13200", "label": "cardinal body part", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13200", "size": 22, "title": "cardinal body part\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: cardinal body part."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13201", "label": "body proper", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13201", "size": 22, "title": "body proper\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: body proper."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13203", "label": "organ", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13203", "size": 22, "title": "organ\nType: AnatomicLocation\nDefinition: Anatomical structure which has as its direct parts portions of two or more types of tissue or two or more types of cardinal organ part which constitute a maximally connected anatomical structure demarcated predominantly by a bona fide anatomical surface. Examples: femur, biceps, liver, heart, skin, tracheobronchial tree, ovary."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13204", "label": "subdivision of body proper", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13204", "size": 22, "title": "subdivision of body proper\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of body proper."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13205", "label": "organ system", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13205", "size": 22, "title": "organ system\nType: AnatomicLocation\nDefinition: Anatomical structure, which has as its direct parts instances of one or more organ types which are interconnected with one another by zones of continuity. Examples: skeletal system, cardiovascular system, alimentary system."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13206", "label": "subdivision of organ system", "mass": 3.3531276428124515, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13206", "size": 22, "title": "subdivision of organ system\nType: AnatomicLocation\nDefinition: Anatomical structure, which consists of a specific set of the members of (predominantly) one organ or organ part subclass interconnected by zones of continuity or body substances; is demarcated from other subdivisions of the same organ system by one or more zones of continuity or anatomical lines; together with other subdivisions of the same organ system, it constitutes an organ system. Examples: rib cage, facial skeleton, portal system, central nervous system, upper respiratory tract, muscle group of back."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13213", "label": "organ zone", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13213", "size": 22, "title": "organ zone\nType: AnatomicLocation\nDefinition: Organ region with one or more floating fiat boundaries. Examples: apical zone of lung, superior pole of kidney, gingiva, apex of prostate, ascending colon proper."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13214", "label": "cardinal organ part", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13214", "size": 22, "title": "cardinal organ part\nType: AnatomicLocation\nDefinition: Anatomical structure which has as its direct parts two or more types of tissue and is continuous with one or more anatomical structures likewise constituted by two or more portions of tissues distinct from those of their complement. Examples: osteon, cortical bone, neck of femur, bronchopulmonary segment, left lobe of liver, anterior right side of heart, interventricular branch of left coronary artery, right atrium, mitral valve, head of pancreas."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13215", "label": "organ segment", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13215", "size": 22, "title": "organ segment\nType: AnatomicLocation\nDefinition: Organ region with one or more anchored fiat boundaries. Examples: artery, trunk of nerve, cervical part of esophagus, pelvic part of vagina, horn of thyroid cartilage, anterior segment of eyeball."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13217", "label": "anatomical space", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13217", "size": 22, "title": "anatomical space\nType: AnatomicLocation\nDefinition: Immaterial anatomical entity which has three spatial dimensions. Examples: celom, thoracic cavity, lesser sac of peritoneum, cavity of right atrium, lumen of aorta, mediastinal space, space of anterior compartment of forearm, intervertebral foramen space."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13218", "label": "immaterial anatomical entity", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13218", "size": 22, "title": "immaterial anatomical entity\nType: AnatomicLocation\nDefinition: Physical anatomical entity which is a three-dimensional space, surface, line or point associated with a material anatomical entity. Examples: body space, surface of heart, costal margin, apex of right lung, anterior compartment of right arm."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13225", "label": "subdivision of cardiovascular system", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13225", "size": 22, "title": "subdivision of cardiovascular system\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of cardiovascular system."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13230", "label": "anatomical set", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13230", "size": 22, "title": "anatomical set\nType: AnatomicLocation\nDefinition: A set may be a complete or partial set of given entities; i.e. \"set of Xes\" may be either all or just some of the Xes in the super group.  E.g. \"set of upper extremity vessels\" may be used to refer to all the blood vessels of the upper extremity, or to some subset of them."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13259", "label": "organ region", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13259", "size": 22, "title": "organ region\nType: AnatomicLocation\nDefinition: Cardinal organ part which is a fiat subdivision of an organ. Examples: lingula of left lung, tail of pancreas, artery, trochanter, nodulus of semilunar valve, right side of heart, duodenum, fundus of stomach."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1326", "label": "left lung", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1326", "size": 22, "title": "left lung\nType: AnatomicLocation\nDefinition: Lung located left of sagittal midplane of body and which consists of the left upper lobe and left lower lobe."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13261", "label": "anatomical cavity", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13261", "size": 22, "title": "anatomical cavity\nType: AnatomicLocation\nDefinition: Anatomical space which contains portions of one or more body substances and is bounded by the internal surface of one maximally connected anatomical structure or two or more adjacent anatomical structures. Examples: pharyngeal recess space, nasal cavity, cavity of serous sac, lumen of stomach, lumen of artery, fornix of vagina."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1327", "label": "upper lobe of left lung", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1327", "size": 22, "title": "upper lobe of left lung\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: upper lobe of left lung."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13273", "label": "wall of organ", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13273", "size": 22, "title": "wall of organ\nType: AnatomicLocation\nDefinition: Organ component  adjacent to an organ cavity and which consists of a maximal aggregate of organ component layers."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13281", "label": "subdivision of cardinal body part", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13281", "size": 22, "title": "subdivision of cardinal body part\nType: AnatomicLocation\nDefinition: Anatomical structure, which is a subdivision of a cardinal body part; it may exclude bones; is demarcated from other subdivisions of the same cardinal body part by anatomical surfaces or lines or topographical references; together with other contiguous subdivisions of the same cardinal body part, it constitutes a cardinal body part. Examples: thorax, perineum, back of neck, forearm, hand, phalanx, nose, auricle of ear, scrotum."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13290", "label": "anatomical cluster", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13290", "size": 22, "title": "anatomical cluster\nType: AnatomicLocation\nDefinition: Anatomical structure, which has as its parts a heterogeneous collection of  organs, organ parts, cells, cell parts or body part subdivisions that are adjacent to, or continuous with one another; does not constitute a cell part, cell,  tissue,  organ, organ system or organ system subdivision, cardinal body part, body part subdivision or anatomical junction. Examples: joint, adnexa of uterus, root of lung, renal pedicle, back."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13296", "label": "lymph node", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13296", "size": 22, "title": "lymph node\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lymph node."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13298", "label": "portion of tissue", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13298", "size": 22, "title": "portion of tissue\nType: AnatomicLocation\nDefinition: Anatomical structure which has as its parts cells of predominantly one type with or without intercellular matrix. Examples: epithelium, muscle tissue, connective tissue, neural tissue, lymphoid tissue."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1333", "label": "lingula", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1333", "size": 22, "title": "lingula\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lingula."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1338", "label": "lower lobe of left lung", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1338", "size": 22, "title": "lower lobe of left lung\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lower lobe of left lung."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13389", "label": "material anatomical entity", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13389", "size": 22, "title": "material anatomical entity\nType: AnatomicLocation\nDefinition: Physical anatomical entity which has mass. Examples: hemoglobin molecule, mitochondrion, hepatocyte, erythrocyte, heart, head, blood, urine."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1339", "label": "superior segment of lower lobe of left lung", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1339", "size": 22, "title": "superior segment of lower lobe of left lung\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: superior segment of lower lobe of left lung."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13390", "label": "anatomical structure", "mass": 3.951594810853967, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13390", "size": 22, "title": "anatomical structure\nType: AnatomicLocation\nDefinition: Material anatomical entity which is generated by coordinated expression of the organism\u0027s own genes that guide its morphogenesis; has inherent 3D shape; its parts are connected and spatially related to one another in patterns determined by coordinated gene expression. Examples: heart, right ventricle, mitral valve, myocardium, endothelium, lymphocyte, fibroblast, thorax, cardiovascular system, hemoglobin, T cell receptor."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13391", "label": "organ component", "mass": 3.750067443913603, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13391", "size": 22, "title": "organ component\nType: AnatomicLocation\nDefinition: Cardinal organ part which is bounded predominantly by bonafide boundaries.  Examples: lobe of lung, osteon, acinus, submucosa, anterior leaflet of mitral valve, capsule of kidney, cortical bone, muscle fasciculus."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13392", "label": "organ component of neuraxis", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13392", "size": 22, "title": "organ component of neuraxis\nType: AnatomicLocation\nDefinition: Organ component which is part of the brain or spinal cord."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13393", "label": "segment of neuraxis", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13393", "size": 22, "title": "segment of neuraxis\nType: AnatomicLocation\nDefinition: Organ segment which is a regional part of neuraxis. Examples: brain, brainstem, spinal cord."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13394", "label": "cell part cluster", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13394", "size": 22, "title": "cell part cluster\nType: AnatomicLocation\nDefinition: Anatomical cluster which has as direct parts cell parts from two or more cells."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13395", "label": "white matter of neuraxis", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13395", "size": 22, "title": "white matter of neuraxis\nType: AnatomicLocation\nDefinition: Cell part cluster consisting predominantly of neurites in the brain and the spinal cord."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13403", "label": "subdivision of neck", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13403", "size": 22, "title": "subdivision of neck\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of neck."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13404", "label": "subdivision of trunk", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13404", "size": 22, "title": "subdivision of trunk\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of trunk."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13405", "label": "subdivision of abdomen", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13405", "size": 22, "title": "subdivision of abdomen\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of abdomen."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13406", "label": "anatomical lobe", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13406", "size": 22, "title": "anatomical lobe\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: anatomical lobe."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13409", "label": "solid organ", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13409", "size": 22, "title": "solid organ\nType: AnatomicLocation\nDefinition: Organ the unshared parts of which do not surround macroscopic anatomical spaces; only its shared parts (subdivisions of hollow tree organs) contain anatomical spaces. Examples: lung, liver, thymus, ovary, muscle (organ), meninx, superficial fascia, skin."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13410", "label": "cavitated organ", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13410", "size": 22, "title": "cavitated organ\nType: AnatomicLocation\nDefinition: Organ the unshared parts of which surround one or more macroscopic anatomical spaces. Examples: neuraxis, tooth, esophagus, heart, long bone, corpus spongiosum of penis."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13411", "label": "subdivision of alimentary system", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13411", "size": 22, "title": "subdivision of alimentary system\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of alimentary system."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13415", "label": "region of organ component", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13415", "size": 22, "title": "region of organ component\nType: AnatomicLocation\nDefinition: Cardinal organ part which is a fiat subdivision of an organ component. Examples: cervical part of wall of esophagus, mucosa of body of stomach."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13416", "label": "lobular organ component", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13416", "size": 22, "title": "lobular organ component\nType: AnatomicLocation\nDefinition: Organ component which has as its parts a wall and a cavity and together with structures of same type constitutes an anatomical lobe or an organ component gland."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13419", "label": "lobular organ", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13419", "size": 22, "title": "lobular organ\nType: AnatomicLocation\nDefinition: Parenchymatous organ the stroma of which subdivides the parenchyma into lobes, segments, lobules and acini. Examples: lung, liver, lactiferous gland, testis."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13444", "label": "organ with organ cavity", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13444", "size": 22, "title": "organ with organ cavity\nType: AnatomicLocation\nDefinition: Cavitated organ in which its unshared parts surround one continuous anatomical space. Examples: stomach, urinary bladder, esophagus, uterine tube."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13445", "label": "neuraxis", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13445", "size": 22, "title": "neuraxis\nType: AnatomicLocation\nDefinition: Organ with organ cavity which consists of gray matter and white matter. Examples: There is only one neuraxis. [FMA]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13475", "label": "cerebral subcortex", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13475", "size": 22, "title": "cerebral subcortex\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: cerebral subcortex."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1360", "label": "small lung component", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1360", "size": 22, "title": "small lung component\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: small lung component."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1361", "label": "secondary pulmonary lobule", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1361", "size": 22, "title": "secondary pulmonary lobule\nType: AnatomicLocation\nDefinition: Anatomy.\u2014The lobule is the smallest unit of lung surrounded by connective-tissue septa, as defined by Miller (78) and Heitzman et al (40). The lobule is also referred to as the secondary pulmonary lobule; it contains a variable number of acini, is irregularly polyhedral in shape, and varies in size from 1.0 to 2.5 cm in diameter. The centrilobular structures, or core structures, include bronchioles and their accompanying pulmonary arterioles and lymphatic vessels. The connective-tissue septa surrounding the pulmonary lobule\u2014the interlobular septa, which contain veins and lymphatic vessels\u2014are best developed in the periphery in the anterior, lateral, and juxtamediastinal regions of the upper and middle lobes. \nCT scans.\u2014On thin-section CT scans, the three basic components of the lobule\u2014the interlobular septa and septal structures, the central lobular region (centrilobular structures), and the lobular parenchyma\u2014can be identified, particularly in disease states. Peripheral lobules are more uniform in appearance and pyramidal in shape than are central lobules (4) (Fig 35).  [Fleischner Society]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1362", "label": "pleura", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1362", "size": 22, "title": "pleura\nType: AnatomicLocation\nDefinition: The thin serous membrane enveloping the lungs (lung) and lining the thoracic cavity. Pleura consist of two layers, the inner visceral pleura lying next to the pulmonary parenchyma and the outer parietal pleura. Between the two layers is the pleural cavity which contains a thin film of liquid. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1363", "label": "pleural space", "mass": 3.951594810853967, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1363", "size": 22, "title": "pleural space\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: pleural space."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1370", "label": "parietal pleura", "mass": 1.9012253958772378, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1370", "size": 22, "title": "parietal pleura\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: parietal pleura."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1371", "label": "visceral pleura", "mass": 1.9012253958772378, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1371", "size": 22, "title": "visceral pleura\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: visceral pleura."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1384", "label": "mediastinum", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1384", "size": 22, "title": "mediastinum\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: mediastinum."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13853", "label": "segment of brain", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13853", "size": 22, "title": "segment of brain\nType: AnatomicLocation\nDefinition: Segment of neuraxis with one or more fixed or anchored fiat boundaries. Examples: thalamus, midbrain, pons, cerebellum, and spinal cord."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13854", "label": "cardinal segment of brain", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13854", "size": 22, "title": "cardinal segment of brain\nType: AnatomicLocation\nDefinition: Segment of brain with one or more fixed or anchored fiat boundaries. Examples: thalamus, midbrain, pons, cerebellum, and medulla oblongata. [FMA]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13855", "label": "segment of forebrain", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13855", "size": 22, "title": "segment of forebrain\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: segment of forebrain."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID13857", "label": "cerebral hemisphere", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID13857", "size": 22, "title": "cerebral hemisphere\nType: AnatomicLocation\nDefinition: One of two bilateral, largely symmetrical organ subdivisions within the telencephalon which contain the cerebral cortex and cerebral white matter."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1463", "label": "lymph node of thorax", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1463", "size": 22, "title": "lymph node of thorax\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lymph node of thorax."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1496", "label": "pulmonary lymph node", "mass": 1.9012253958772378, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1496", "size": 22, "title": "pulmonary lymph node\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: pulmonary lymph node."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1517", "label": "axillary lymph node", "mass": 1.9012253958772378, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID1517", "size": 22, "title": "axillary lymph node\nType: AnatomicLocation\nDefinition: BI-RADS US:"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID1520", "label": "anterior mediastinal lymph node", "mass": 1.9012253958772378, "ontologyType": "AnatomicLocation", "shap and medulla. Examples: thymus, spleen, ovary."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID28919", "label": "lymph node of trunk", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID28919", "size": 22, "title": "lymph node of trunk\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lymph node of trunk."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29109", "label": "portion of body substance", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29109", "size": 22, "title": "portion of body substance\nType: AnatomicLocation\nDefinition: Material anatomical entity in a gaseous, liquid, semisolid or solid state, with or without the admixture of cells and biological macromolecules; produced by anatomical structures or derived from inhaled and ingested substances that have been modified by anatomical structures. Examples: saliva, semen, cerebrospinal fluid, respiratory air, urine, feces, blood, plasma, lymph."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29521", "label": "portion of serous fluid", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29521", "size": 22, "title": "portion of serous fluid\nType: AnatomicLocation\nDefinition: Transudate contained in a serous sac."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29528", "label": "anatomical compartment", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29528", "size": 22, "title": "anatomical compartment\nType: AnatomicLocation\nDefinition: Anatomical cluster which has as its parts one or more anatomical structures surrounding an anatomical compartment space and the contents of that space. Examples: mediastinal part of chest,  anterior compartment of forearm, palm of hand(compartment),  intercostal space, vertebral canal"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29529", "label": "compartment of trunk", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29529", "size": 22, "title": "compartment of trunk\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: compartment of trunk."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29530", "label": "body compartment subdivision", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29530", "size": 22, "title": "body compartment subdivision\nType: AnatomicLocation\nDefinition: Compartment of trunk which is enclosed by a body wall subdivision and is demarcated from another body cavity subdivision by an anatomical structure or a conduit, it contains one or more serous sacs, viscera and other organs; together with the other body cavity subdivisions, it constitutes the body cavity. Examples: thoracic cavity, abdominopelvic cavity, abdominal cavity, pelvic cavity."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29531", "label": "subdivision of abdominal compartment", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29531", "size": 22, "title": "subdivision of abdominal compartment\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdivision of abdominal compartment."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29542", "label": "left side of retroperitoneal compartment", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29542", "size": 22, "title": "left side of retroperitoneal compartment\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: left side of retroperitoneal compartment."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29840", "label": "trunk proper", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29840", "size": 22, "title": "trunk proper\nType: AnatomicLocation\nDefinition: Subdivision of trunk which is demarcated from the back of trunk by the external surface of the posterolateral part of the rib cage, the anterior surface of the thoracic vertebral column and the posterior axillary lines, the external surface of the posterior abdominal wall and from the limbs by the inguinal folds; together with the back of trunk, it constitutes the trunk. Examples: There is only one trunk proper."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29841", "label": "male trunk proper", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29841", "size": 22, "title": "male trunk proper\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: male trunk proper."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29842", "label": "female trunk proper", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID29842", "size": 22, "title": "female trunk proper\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: female trunk proper."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID29846", "label": "thoracic segment of trunk", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "short SH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID479", "label": "systemic artery", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID479", "size": 22, "title": "systemic artery\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: systemic artery."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID50344", "label": "lobe of thyroid gland", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID50344", "size": 22, "title": "lobe of thyroid gland\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lobe of thyroid gland."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID56", "label": "abdomen", "mass": 3.951594810853967, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID56", "size": 22, "title": "abdomen\nType: AnatomicLocation\nDefinition: Subdivision of trunk proper which is demarcated from the thorax internally by the inferior surface of the sternocostal part of the diaphragm and externally by the costal margin, from the back of abdomen by the external surface of the posterior abdominal wall,  from the perineum by the superior surface of the urogenital diaphragm and from the lower limbs by the inguinal folds; together with the thorax, and perineum, it constitutes the trunk proper. Examples: There is only one abdomen. [FMA]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID58", "label": "liver", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID58", "size": 22, "title": "liver\nType: AnatomicLocation\nDefinition: Lobular organ which has as its parts lobules connected to the biliary tree. Examples: There is only one liver."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID585", "label": "internal carotid artery", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID585", "size": 22, "title": "internal carotid artery\nType: AnatomicLocation\nDefinition: Branch of the common carotid artery which supplies the anterior part of the brain, the eye and its appendages, the forehead and nose. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID593", "label": "cavernous branch of internal carotid artery", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID593", "size": 22, "title": "cavernous branch of internal carotid artery\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: cavernous branch of internal carotid artery."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID5978", "label": "parenchyma", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID5978", "size": 22, "title": "parenchyma\nType: AnatomicLocation\nDefinition: Organ component constituted by specialized tissues which are organized into acini, lobules, segments, and lobes, or corticomedullary units and supported by stroma. Examples: parenchyma of lung, parenchyma of liver, parenchyma of kidney."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID5988", "label": "cortex", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID5988", "size": 22, "title": "cortex\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: cortex."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6", "label": "RadLex descriptor", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6", "size": 22, "title": "RadLex descriptor\nType: AnatomicLocation\nDefinition: The leaf node children are adjectives, rather than noun phrases as entities should be."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6067", "label": "tendon", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6067", "size": 22, "title": "tendon\nType: AnatomicLocation\nDefinition: Fibrous bands or cords of connective tissue at the ends of muscle fibers that serve to attach the muscles to bones and other structures. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6375", "label": "head location descriptor", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6375", "size": 22, "title": "head location descriptor\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: head location descriptor."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6383", "label": "intracranial", "mass": 1.9012253958772378, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6383", "size": 22, "title": "intracranial\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: intracranial."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6433", "label": "nervous system", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6433", "size": 22, "title": "nervous system\nType: AnatomicLocation\nDefinition: The entire nerve apparatus, composed of a central part, the brain and spinal cord, and a peripheral part, the cranial and spinal nerves, autonomic ganglia, and plexuses. (Stedman, 26th ed) [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6434", "label": "brain", "mass": 4.197275804375345, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6434", "size": 22, "title": "brain\nType: AnatomicLocation\nDefinition: Segment of neuraxis that has as its parts gray matter and white matter that surround the cerebral ventricular system;  Examples: There is only one brain."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6435", "label": "prosencephalon", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6435", "size": 22, "title": "prosencephalon\nType: AnatomicLocation\nDefinition: Organ component of neuraxis that has as its parts the telencephalon, diencephalon, lateral ventricles and third ventricle. Examples: There is only one forebrain."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID6437", "label": "telencephalon", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID6437", "size": 22, "title": "telencephalon\nType: AnatomicLocation\nDefinition: Organ component of neuraxis that has as its parts the cerebral cortex, cerebral white matter, basal ganglia, septum and fornix, as well as subcortical gray and white matter structures.  There is only one telencephalon."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID648", "label": "anterior cerebral artery", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID648", "size": 22, "title": "anterior cerebral artery\nType: AnatomicLocation\nDefinition: Artery formed by the bifurcation of the internal carotid artery (carotid artery, internal). Branches of the anterior cerebral artery supply the caudate nucleus; internal CAPSULE; putamen; septal nuclei; gyrus cinguli; and surfaces of the frontal lobe and parietal lobe. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID665", "label": "middle cerebral artery", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID665", "size": 22, "title": "middle cerebral artery\nType: AnatomicLocation\nDefinition: The largest and most complex of the cerebral arteries. Branches of the middle cerebral artery supply the insular region, motor and premotor areas, and large regions of the association cortex. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID684", "label": "external carotid artery", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID684", "size": 22, "title": "external carotid artery\nType: AnatomicLocation\nDefinition: Branch of the common carotid artery which supplies the exterior of the head, the face, and the greater part of the neck. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7110", "label": "nervous system space", "mass": 3.180167946706389, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7110", "size": 22, "title": "nervous system space\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: nervous system space."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7111", "label": "epidural space", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7111", "size": 22, "title": "epidural space\nType: AnatomicLocation\nDefinition: Space between the dura mater and the walls of the vertebral canal. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7119", "label": "subarachnoid space", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7119", "size": 22, "title": "subarachnoid space\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subarachnoid space."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7120", "label": "subdural space", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7120", "size": 22, "title": "subdural space\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: subdural space."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7123", "label": "cerebral ventricle", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7123", "size": 22, "title": "cerebral ventricle\nType: AnatomicLocation\nDefinition: Segment of ventricular system of brain which has as its direct proper parts wall of cerebral ventricle and cavity of cerebral ventricle."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7124", "label": "lateral ventricle", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7124", "size": 22, "title": "lateral ventricle\nType: AnatomicLocation\nDefinition: Cavity in each of the cerebral hemispheres derived from the cavity of the embryonic neural tube. They are separated from each other by the septum pellucidum, and each communicates with the third ventricle by the foramen of Monro, through which also the choroid plexuses (choroid plexus) of the lateral ventricles become continuous with that of the third ventricle. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7488", "label": "neck", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7488", "size": 22, "title": "neck\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: neck."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7576", "label": "infrahyoid neck", "mass": 2.9742011616246344, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7576", "size": 22, "title": "infrahyoid neck\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: infrahyoid neck."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7577", "label": "visceral space", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7577", "size": 22, "title": "visceral space\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: visceral space."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7578", "label": "thyroid gland", "mass": 3.8555161915432032, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7578", "size": 22, "title": "thyroid gland\nType: AnatomicLocation\nDefinition: A highly vascularized endocrine gland consisting of two lobes joined by a thin band of tissue with one lobe on each side of the trachea. It secretes thyroid hormones from the follicular cells and calcitonin from the parafollicular cells thereby regulating metabolism and calcium level in blood, respectively. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7579", "label": "left lobe of thyroid gland", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7579", "size": 22, "title": "left lobe of thyroid gland\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: left lobe of thyroid gland."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7581", "label": "right lobe of thyroid gland", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7581", "size": 22, "title": "right lobe of thyroid gland\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: right lobe of thyroid gland."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7584", "label": "isthmus of thyroid gland", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7584", "size": 22, "title": "isthmus of thyroid gland\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: isthmus of thyroid gland."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID7695", "label": "lymph node of neck", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID7695", "size": 22, "title": "lymph node of neck\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: lymph node of neck."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID791", "label": "basilar artery", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID791", "size": 22, "title": "basilar artery\nType: AnatomicLocation\nDefinition: The artery formed by the union of the right and left vertebral arteries; it runs from the lower to the upper border of the pons, where it bifurcates into the two posterior cerebral arteries. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID804", "label": "posterior cerebral artery", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID804", "size": 22, "title": "posterior cerebral artery\nType: AnatomicLocation\nDefinition: Artery formed by the bifurcation of the basilar artery. Branches of the posterior cerebral artery supply portions of the occipital lobe; parietal lobe; inferior temporal gyrus, brainstem, and choroid plexus. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID86", "label": "spleen", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID86", "size": 22, "title": "spleen\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: spleen."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID88", "label": "adrenal gland", "mass": 3.3531276428124515, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID88", "size": 22, "title": "adrenal gland\nType: AnatomicLocation\nDefinition: A pair of glands located at the cranial pole of each of the two kidneys. Each adrenal gland is composed of two distinct endocrine tissues with separate embryonic origins, the adrenal cortex producing steroids and the adrenal medulla producing neurotransmitters. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID89", "label": "limb of adrenal gland", "mass": 2.3859976799162124, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID89", "size": 22, "title": "limb of adrenal gland\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: limb of adrenal gland."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID9080", "label": "head", "mass": 3.750067443913603, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID9080", "size": 22, "title": "head\nType: AnatomicLocation\nDefinition: Imported from RadLex 4.3: head."}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID92", "label": "cortex of adrenal gland", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID92", "size": 22, "title": "cortex of adrenal gland\nType: AnatomicLocation\nDefinition: The outer layer of the adrenal gland. It is derived from mesoderm and comprised of three zones (outer zona glomerulosa, middle zona fasciculata, and inner zona reticularis) with each producing various steroids preferentially, such as aldosterone; hydrocortisone; dehydroepiandrosterone; and androstenedione. Adrenal cortex function is regulated by pituitary adrenocorticotropin. [MeSH]"}, {"borderWidth": 1.5, "color": "#0891B2", "font": {"color": "white"}, "id": "https://radelement.org/ng/anatomy/RID974", "label": "pulmonary artery", "mass": 2.7195863119208847, "ontologyType": "AnatomicLocation", "shape": "triangle", "shortId": "RID974", "size": 22, "title": "pulmonary artery\nType: AnatomicLocation\nDefinition: The short wide vessel arising from the conus arteriosus of the right ventricle and conveying unaerated blood to the lungs. [MeSH]"}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasIntervalChange", "label": "interval change", "mass": 5.606197208787863, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasIntervalChange", "size": 23, "title": "interval change\nType: DataElement\nDefinition: The relationship of the finding to the same finding on a prior comparable examination."}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasLaterality", "label": "laterality", "mass": 5.033883717440298, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasLaterality", "size": 23, "title": "laterality\nType: DataElement\nDefinition: Which side of a paired structure the finding involves."}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasPresence", "label": "presence", "mass": 6.069167074540724, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasPresence", "size": 23, "title": "presence\nType: DataElement\nDefinition: Whether the observation is judged to be present on this examination."}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasVascularTerritory", "label": "vascular territory", "mass": 3.7415138714594156, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasVascularTerritory", "size": 23, "title": "vascular territory\nType: DataElement\nDefinition: Which arterial supply the infarct conforms to. A territorial infarct implicates the named artery; a watershed pattern implicates global hypoperfusion instead."}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasSeverity", "label": "severity", "mass": 3.8593736690001728, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasSeverity", "size": 23, "title": "severity\nType: DataElement\nDefinition: Graded magnitude of a process where no measurement is taken."}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasCalcification", "label": "calcification", "mass": 4.233300326691697, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasCalcification", "size": 23, "title": "calcification\nType: DataElement\nDefinition: The presence and pattern of calcium within the lesion."}, {"borderWidth": 1.5, "color": "#16A34A", "font": {"color": "white"}, "id": "https://radelement.org/ng/hasAtelectasisMechanism", "label": "atelectasis mechanism", "mass": 3.609228853774707, "ontologyType": "DataElement", "shape": "dot", "shortId": "hasAtelectasisMechanism", "size": 23, "title": "atelectasis mechanism\nType: DataElement\nDefinition: Why the lung has lost vol
