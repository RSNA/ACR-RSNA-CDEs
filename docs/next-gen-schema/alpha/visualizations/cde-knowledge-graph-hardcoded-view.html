<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDE knowledge graph skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F3F2; --surface:#FFFFFF; --quiet:#F7F9F8;
  --ink:#152220; --muted:#5B6A67; --faint:#8B9996;
  --rule:#DAE0DE; --hair:#E8EDEB;
  --finding:#0E7C66; --diagnosis:#7B3FA0; --assessment:#C2571A;
  --element:#2A5CA8; --measurement:#B0305F; --anatomy:#7A6420;
  --concept:#4A5F5C; --value:#4C7A9B; --open:#B0761E;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--finding);outline-offset:2px;border-radius:3px}

.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 22px;background:#0039A6;color:#fff}
.bar h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:-.01em;
  color:#fff;line-height:1;position:relative;top:2px}
.bar .spacer{margin-left:auto}
.brand{display:flex;align-items:flex-end;gap:14px}
.brand .logo{display:flex;align-items:flex-end;line-height:0}
.brand .acrmark{height:26px;width:auto;display:block}
.mainnav{display:flex;gap:2px;margin-left:14px}
.mainnav button{font-size:13.5px;color:rgba(255,255,255,.85);padding:5px 11px;border-radius:3px}
.mainnav button:hover{background:rgba(255,255,255,.14);color:#fff}
.mainnav button[aria-current="true"]{color:#fff;background:rgba(255,255,255,.16);box-shadow:inset 0 -2px 0 #fff}
.searchbox{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.42);border-radius:3px;
  padding:3px 9px;background:rgba(255,255,255,.12);min-width:190px}
.searchbox:focus-within{background:#fff;border-color:#fff}
.searchbox .mag{color:rgba(255,255,255,.75);font-size:15px;line-height:1}
.searchbox input{border:none;background:transparent;outline:none;font:inherit;font-size:13px;width:100%;padding:3px 0;color:#fff}
.searchbox input::placeholder{color:rgba(255,255,255,.7)}
.searchbox:focus-within .mag{color:var(--faint)}
.searchbox:focus-within input{color:var(--ink)}
.panel .searchbox{border-color:var(--rule);background:var(--quiet)}
.panel .searchbox .mag{color:var(--faint)}
.panel .searchbox input{color:var(--ink)}
.panel .searchbox input::placeholder{color:var(--faint)}

.panel{max-width:1400px;margin:0 auto;padding:22px 22px 48px}
.panel h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.filters button{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:12px;padding:4px 11px;color:var(--muted);background:var(--surface)}
.filters button:hover{border-color:#BFCAC7;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.browsewrap{max-width:820px}
.results{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.pathgroup{margin:0 0 14px 10px;padding-left:12px;border-left:2px solid var(--hair)}
.pathcrumb{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;margin:0 0 7px;line-height:1.35}
.pathcrumb .sepc{color:#B7C2BF;font-size:12px}
.pathcrumb .step{font-size:12px;color:var(--muted);padding:0}
.pathcrumb .step:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.pathcrumb .laststep{font-size:12.5px;color:var(--anatomy);font-weight:500;padding:0}
.pathcrumb .laststep:hover{text-decoration:underline;text-underline-offset:2px}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  font-size:12.5px;color:var(--muted)}
.pager.top{margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.pager.bottom{margin-top:12px;padding-top:9px;border-top:1px solid var(--rule)}
.pager .count b{color:var(--ink);font-weight:500}
.pagenav{display:flex;align-items:center;gap:7px}
.pagebtn{border:1px solid var(--rule);border-radius:3px;padding:4px 11px;font-size:12.5px;background:var(--surface)}
.pagebtn:hover:not(:disabled){background:var(--quiet);border-color:#C4CECB}
.pagebtn:disabled{color:#C2CBC8;cursor:default;border-color:var(--hair)}
.pagesize{font:inherit;font-size:12.5px;border:1px solid var(--rule);border-radius:3px;
  padding:4px 8px;background:var(--surface);color:var(--ink)}
.result{display:flex;align-items:baseline;gap:10px;text-align:left;width:100%;min-width:0;background:var(--surface);
  border:1px solid var(--hair);border-left:3px solid var(--type);border-radius:3px;padding:9px 12px}
.result:hover{border-color:#C4CECB;background:#FDFEFD}
.result .tag{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--type);flex:none;width:88px}
.result .body{flex:1;min-width:0}
.result .nm{font-family:var(--serif);font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.result .sn{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .recmeta{display:flex;align-items:center;gap:8px;flex:none;font-family:var(--mono);font-size:10px;white-space:nowrap}
.result .rid{color:var(--muted)}
.result .rv{color:var(--faint)}
.result .ru{color:var(--faint)}
.result .rs{letter-spacing:.07em;text-transform:uppercase;border-radius:2px;padding:0 5px;font-size:9px}
.result .rs.published{color:#0E7C66;border:1px solid #B9D6CD;background:#F1F8F5}
.result .rs.proposed{color:#B0761E;border:1px solid #E2C99A;background:#FDF7EC}
.result .rs.draft{color:#5B6A67;border:1px solid var(--hair);background:var(--quiet)}
.result .rs.retired{color:#8B5C5C;border:1px solid #DFC4C4;background:#FBF3F3}
.noresult{font-size:13px;color:var(--faint);border:1px dashed var(--rule);border-radius:3px;padding:12px;background:var(--quiet)}
.result .anat{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--anatomy);border:1px solid #E3DFC9;border-radius:2px;padding:0 5px;margin-left:7px;white-space:nowrap}
.panelbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.panelbar .searchbox{min-width:230px}
.sortgroup{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.sortgroup button{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:5px 10px;color:var(--muted);background:var(--surface)}
.sortgroup button+button{border-left:1px solid var(--rule)}
.sortgroup button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grouphd{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.grouphd::after{content:"";flex:1;height:1px;background:var(--rule)}
.grouphd:first-child{margin-top:0}
.orient{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:3px;overflow:hidden}
.orient button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 11px;color:rgba(255,255,255,.88);background:transparent}
.orient button+button{border-left:1px solid rgba(255,255,255,.5)}
.orient button:hover{background:rgba(255,255,255,.14)}
.orient button[aria-pressed="true"]{background:#fff;color:#0039A6;font-weight:600}


.stage{display:grid;gap:0 12px;align-items:start;padding:24px 22px 56px;max-width:1400px;margin:0 auto}
body.land .stage{grid-template-columns:minmax(190px,1fr) 34px minmax(340px,1.5fr) 34px minmax(250px,1.15fr)}
body.port .stage{grid-template-columns:1fr;gap:10px 0}
.sep{display:flex;align-items:center;justify-content:center;color:#C6D0CD;user-select:none}
body.land .sep span{font-size:30px;line-height:1;color:#AFBCB8}
body.port .sep{padding:2px 0}
body.port .sep span{font-size:24px;line-height:1;color:#AFBCB8}

.side{display:flex;flex-direction:column;gap:24px;min-width:0}
body.land .side{padding-top:54px}
body.port .side{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:start}
.colhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:500;color:#3E4E4B;display:flex;align-items:center;gap:8px}
body.land .side.left .colhead{justify-content:flex-end;order:-1}
body.land .side.right .colhead{justify-content:flex-start;order:-1}
body.port .side .colhead{grid-column:1/-1;justify-content:center}
body.port .side.left .colhead{order:99}
body.port .side.right .colhead{order:-1}

.grouplabel{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;color:var(--ink);margin:0 0 9px;display:flex;align-items:center;gap:8px}
.grouplabel::after{content:"";flex:1;height:2px;background:#C9D3D0;border-radius:1px}
.groupsub{font-size:11.5px;line-height:1.4;color:var(--muted);margin:-4px 0 7px}
.reach{display:flex;align-items:baseline;gap:7px;margin:0 0 9px;font-size:11.5px;
  line-height:1.45;color:var(--muted)}
.reach .kindtag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--anatomy);border:1px solid #DCD2AE;border-radius:2px;padding:0 5px;flex:none}
.reach .rt b{color:var(--ink);font-weight:500}
.reachfn{font-family:var(--mono);font-size:9.5px;color:#A6B2AF;margin:-5px 0 9px 0}
.groupfn{font-family:var(--mono);font-size:9.5px;color:#A6B2AF;margin-top:7px}
.focusrow{display:flex;flex-direction:column;min-width:0}
.focusrow>.focus{flex:1 1 auto;min-width:0}
.vlink{display:flex;align-items:center;justify-content:center;flex:none}
.vlink .ar{font-size:20px;line-height:1;color:#AFBCB8}
body.land .vlink{padding:8px 0}
body.port .focusrow{flex-direction:row;align-items:stretch;gap:0}
body.port .focusrow>.focus{flex:1 1 58%}
body.port .focusrow>.anatcard{flex:1 1 42%;align-self:flex-start}
body.port .vlink{padding:0 10px;align-items:flex-start;padding-top:34px}
.anatcard{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--anatomy);
  border-radius:3px;padding:14px 18px 13px;margin-top:0;box-shadow:0 2px 10px rgba(18,40,36,.05)}
.anatcard .hd{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:600;color:var(--anatomy);margin-bottom:3px}
.anatcard .sub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.anatcard .sub b{color:var(--ink);font-weight:600}
.anatcard .scopeblock{margin-bottom:14px}
.anatcard .inheritnote{font-size:11.5px;line-height:1.55;color:var(--muted);margin:0 0 12px}
.anatcard .inheritnote b{color:var(--ink);font-weight:500}
.anatcard dd .who{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--hair);
  background:var(--surface);border-radius:2px;padding:2px 9px;font-size:12.5px}
.anatcard dd .who:hover{border-color:#C4CECB}
.anatcard dd .who .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--chiptype)}
.anatcard .orsub{font-size:12px;color:var(--muted);margin-left:8px}
.anatcard .anatref{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px;margin:0 0 8px 2px}
.anatcard .scope{position:relative;border:1px solid var(--hair);border-radius:3px;background:var(--quiet);
  padding:11px 13px}
.anatcard .seclabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;color:var(--ink);margin:0 0 9px;display:flex;align-items:center;gap:8px}
.anatcard .seclabel::after{content:"";flex:1;height:2px;background:#C9D3D0;border-radius:1px}
.anatcard .seclabel.sec2{margin-top:16px;padding-top:14px;border-top:1px solid #E2E8E6}
.anatcard .scopex{position:absolute;top:6px;right:8px;color:#B9C3C0;font-size:15px;line-height:1;padding:2px 4px}
.anatcard .scopex:hover{color:var(--ink)}
.anatcard .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  line-height:1.35;margin:0 0 7px 2px}
.anatcard .crumb .sepc{color:#AEBAB7;font-size:14px;line-height:1.3}
.anatcard .crumb .up{font-size:13px;line-height:1.35;color:var(--muted);padding:0}
.anatcard .crumb .up:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.anatcard .crumb .here{font-family:var(--serif);font-size:21px;line-height:1.3;color:var(--ink);padding:0}
.anatcard .crumb .here:hover{text-decoration:underline;text-underline-offset:3px}
.anatcard dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0;align-items:baseline}
.anatcard dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);line-height:1.5;white-space:nowrap}
.anatcard dd{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.anatcard dd b{color:var(--ink);font-weight:500}
.anatcard .codechip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--hair);
  background:var(--surface);border-radius:2px;padding:1px 8px;font-size:12px;line-height:1.5;margin-right:8px}
.anatcard .codechip:hover{border-color:#C4CECB}
.anatcard .codechip b{font-weight:500;color:var(--ink)}
.anatcard .codechip code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.anatcard .mapnote{font-size:12px;color:var(--muted)}
.anatcard .fn{color:var(--anatomy);font-weight:600;vertical-align:super;font-size:8px;margin-left:1px}
.anatcard .anatnote{margin-top:10px;text-align:right;font-size:10.5px;line-height:1.45;color:var(--faint)}

.tile{background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--type,var(--rule));border-radius:3px;margin-bottom:6px;overflow:hidden}
.tilehead{width:100%;display:flex;align-items:baseline;gap:8px;padding:7px 10px;text-align:left}
.tilehead:hover{background:var(--quiet)}
.tilehead .tag{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--type);flex:none}
.tilehead .nm{font-family:var(--serif);font-size:15.5px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.port .tilehead{flex-wrap:wrap;row-gap:3px}
body.port .tilehead .nm{flex:1 1 100%;order:2;white-space:normal;overflow:visible}
body.port .tilehead .tag{order:1}
body.port .tilehead .ct{order:3;flex:0 0 auto}
body.port .tilehead .anattag,body.port .tilehead .usetag,body.port .tilehead .ctxnote{order:4}
body.port .tilehead .cv{order:5;margin-left:auto}
.tilehead .ct{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap;flex:none}
.modbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 12px}
.modbar .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-right:5px}
.modbar label{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);
  border-radius:12px;padding:3px 10px;cursor:pointer;background:var(--surface)}
.modbar label:hover{border-color:#BFCAC7;color:var(--ink)}
.modbar label.on{background:var(--ink);border-color:var(--ink);color:#fff}
.modbar input{appearance:none;width:7px;height:7px;border-radius:50%;border:1px solid currentColor;margin:0}
.modbar label.on input{background:#fff;border-color:#fff}
.modnote{font-size:11px;line-height:1.5;color:var(--open);border:1px dashed #E2C99A;
  border-radius:2px;padding:6px 11px;margin:0 0 12px;width:100%;box-sizing:border-box}
.field .modnote{margin:7px 0 0}
.prov{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prov b{font-weight:500;color:var(--ink)}
.bind{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
.bind b{font-weight:500;color:var(--ink)}
.bind .pri{color:var(--anatomy);border:1px solid #DCD2AE;border-radius:2px;padding:0 4px;font-size:9px;
  letter-spacing:.07em;text-transform:uppercase;margin-left:5px}
.anattag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--anatomy);border:1px solid #E3DFC9;border-radius:2px;padding:0 5px;white-space:nowrap;flex:none}
.usetag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--assessment);border:1px solid #E8CDB4;border-radius:2px;padding:0 5px;white-space:nowrap}
.tilehead .cv{color:#98A5A2;font-size:11px;flex:none;line-height:1}
.tile.ctx{border-color:#7FB3A5;border-left-width:5px;box-shadow:0 0 0 3px rgba(14,124,102,.16)}
.tile.ctx .tilehead{background:#E6F2EE}
.tile.ctx .tilehead:hover{background:#DDEDE7}
.tile.ctx .tilebody{background:#F4F9F7}
.ctxrow{display:flex;justify-content:center;padding:6px 10px 0;background:#E6F2EE}
.ctxnote{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--finding);border:1px solid var(--finding);border-radius:2px;
  padding:1px 6px;white-space:nowrap;display:inline-block}
.tile.ctx .ctxrow+.tilehead{padding-top:5px}
.tile.ctx .ctxrow{background:#E6F2EE}
.tilebody{display:none;padding:0 11px 11px 11px;border-top:1px solid var(--hair)}
.tile.open .tilebody{display:block}
.tilebody p{margin:9px 0 8px;font-size:12.5px;color:var(--muted)}
.rel{margin:9px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);background:var(--quiet);border:1px solid var(--hair);border-radius:3px;padding:6px 9px}
.rel b{font-weight:500;color:var(--ink)}
.rel em{font-style:normal;color:var(--type);font-weight:500}
.rel .self{color:var(--faint)}
.rel .relk{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase}
.rel .edgecode{display:block;font-family:var(--mono);font-size:9.5px;color:#B6C1BE;letter-spacing:.06em;margin-bottom:4px}
.open-row{display:flex;justify-content:flex-end;margin-top:12px}
.open-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--type,var(--ink));border-radius:2px;padding:8px 14px;
  background:var(--type,var(--ink));color:#fff;font-weight:500}
.open-btn:hover{filter:brightness(1.12)}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;color:var(--muted);background:var(--quiet);border:1px solid var(--hair);border-radius:10px;padding:1px 8px}
button.chiplink{cursor:pointer;font-family:inherit;line-height:1.5}
button.chiplink:hover{border-color:var(--value);color:var(--ink);background:#fff}
.extra{font-family:var(--mono);font-size:10px;color:var(--faint);padding-left:2px}
.moretoggle{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border:1px dashed var(--rule);border-radius:2px;padding:5px 10px;
  width:100%;text-align:left;background:var(--quiet)}
.moretoggle:hover{color:var(--ink);border-color:#C6D0CD}
.flag{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--open);border:1px dashed #E2C99A;border-radius:2px;padding:1px 6px}

.val{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--hair);
  border-left:3px solid var(--value);border-radius:3px;padding:8px 11px;margin-bottom:6px}
.val:hover{border-color:#C4CECB;background:#FDFEFD}
.val .vn{font-family:var(--serif);font-size:15px;line-height:1.2}
.vfn{color:var(--open);font-weight:600;margin-left:3px}
.val .vd{font-size:12.5px;color:var(--muted);margin-top:3px}
.val .vm{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:5px}
.val .vempty{font-size:12px;color:#BCC5C2;margin-top:3px}

.ctxband{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px;
  background:var(--quiet);border:1px solid var(--hair);border-left:4px solid var(--fromtype,var(--rule));
  border-radius:3px;padding:8px 12px}
.ctxband .arrow{color:var(--fromtype);font-size:14px;line-height:1}
.trailwrap{margin-bottom:8px}
.trailtog{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);padding:3px 0 0;display:flex;align-items:center;gap:6px}
.trailtog:hover{color:var(--ink)}
.trailtog .cv{font-size:8px}
.trailtog .ct{color:#B6C1BE}
.ctxband{margin-bottom:0;padding:4px 9px;gap:6px}
.ctxband .arrow{font-size:12px}
.ctxband .who{padding:1px 8px;font-size:12.5px}
.ctxverb{font-size:10.5px;color:var(--faint);margin:0;line-height:1.3}
.ctxband .who{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--hair);
  background:var(--surface);border-radius:2px;padding:2px 9px;font-size:13px}
.ctxband .who:hover{border-color:#C4CECB}
.ctxband .who .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--chiptype)}
.focustype{font-family:var(--mono);font-size:15px;letter-spacing:.2em;font-weight:500;text-transform:uppercase;color:var(--type);margin:0 0 8px;display:flex;align-items:center;gap:9px}
.focustype::after{content:"";flex:1;height:2px;background:var(--type);opacity:.22}
.focus{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--type);border-radius:3px;padding:20px 24px 18px;box-shadow:0 3px 18px rgba(18,40,36,.07)}
.focus h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.08;letter-spacing:-.015em;margin:0}
.fields{margin-top:16px;border-top:1px solid var(--hair)}
.field{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--hair)}
.field dt{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:500;color:#4A5A57;padding-top:3px}
.field dd{margin:0;min-width:0}
.opt{color:#C2CBC8}
.opennotes{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.opennotes .flag{margin-top:0;white-space:normal;line-height:1.5;text-transform:none;letter-spacing:.02em;font-size:11px}
.syn{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.syn .s{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--quiet);border:1px solid var(--hair);border-radius:2px;padding:1px 4px 1px 7px}
.syn .s small{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--concept);
  border:1px solid #D3DBD9;border-radius:2px;padding:0 4px;margin-left:2px}
.syn .s .x{color:#B9C3C0;font-size:13px;line-height:1;padding:0 2px}
.syn .s .x:hover{color:var(--ink)}
.linkrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.tlink{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--hair);background:var(--quiet);border-radius:2px;font-size:12.5px}
.tlink:hover{border-color:#C4CECB;background:#fff}
.tlink .tlabel{padding:2px 4px 2px 8px;text-align:left}
.tlink .tlabel:hover{text-decoration:underline;text-underline-offset:2px}
.tlink code{font-family:var(--mono);font-size:10px;color:var(--faint)}
.sysbox{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--muted);
  border:1px solid var(--hair);background:#fff;border-radius:2px;padding:1px 5px;white-space:nowrap}
.sysbox b{font-weight:600;color:var(--ink)}
.bind .mtch,.tlabel .mtch{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--concept);
  border:1px solid #D3DBD9;border-radius:2px;padding:0 4px;margin-left:2px}
.tlink .mtch{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--concept);
  border:1px solid #D3DBD9;border-radius:2px;padding:0 4px;margin-left:2px}
.tlink .x{color:#B9C3C0;font-size:13px;line-height:1;padding:2px 6px 2px 2px}
.tlink .x:hover{color:var(--ink)}
.addrow{margin-top:6px}
.deffield{display:flex;align-items:flex-start;gap:10px}
.deffield .deftext{flex:1;min-width:0}
.deffield .miniadd{flex:none}
.miniadd{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px dashed var(--rule);border-radius:2px;padding:3px 8px;background:transparent}
.miniadd:hover{color:var(--ink);border-color:#C6D0CD}
.map{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.field .prov{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.field .prov b{color:var(--ink);font-weight:500}
.stamp{font-family:var(--mono);font-size:11px;color:var(--faint);display:inline-flex;align-items:baseline;gap:7px}
.empty{font-size:12.5px;color:var(--faint);border:1px dashed var(--rule);border-radius:3px;padding:7px 10px;background:var(--quiet)}
.add{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--rule);border-radius:2px;padding:6px 10px;width:100%;text-align:left;background:var(--quiet);margin-top:7px}
.add:hover{color:var(--ink);border-color:#C6D0CD}
.legend{max-width:1400px;margin:0 auto;padding:0 22px 44px;font-family:var(--mono);font-size:10.5px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend b{font-family:var(--mono);font-weight:500;color:var(--ink);margin-left:2px}

    (n.rawMaps||[]).forEach(m=>{
      const code=m[0]+'|'+m[1];
      let ck=byCode[code];
      if(!ck){
        ck='c:'+m[0].toLowerCase()+':'+m[1];
        byCode[code]=ck;
        N[ck]={type:'concept',name:m[2],id:m[1],system:m[0],sourceVersion:null,
          definition:m[0]==='RADLEX'?'RadLex concept for '+m[2]+'.':'SNOMED CT concept for '+m[2]+'.',
          synonyms:[],
          left:[{usage:true,label:'What maps here',edge:'MAPPED_TO',phrase:'maps to',
                 subj:'other',items:[]}],
          right:[]};
      }
      m[4]=ck;
      const users=N[ck].left[0].items;
      if(!users.includes(k))users.push(k);
    });
  });
})();

let hist=['pulmonary_nodule'], ptr=0, openTiles=new Set(), closedTiles=new Set(), shownAll=new Set();

let pendingDir=null;

/* which way did we travel? into detail, or back up the chain */
function directionTo(key){
  const n=N[focusKey()];
  const inGroups=gs=>(gs||[]).some(g=>{
    if(g.vals)return (n.values||[]).some(v=>v.key===key);
    return (g.items||[]).includes(key);
  });
  if(inGroups(n.right))return 'fwd';
  if(inGroups(n.left))return 'back';
  return 'fwd';
}

const OUT_MS=250;
let animating=false;

function playTransition(){
  if(!pendingDir)return;
  const st=document.getElementById('stage');
  st.classList.remove('out-fwd','out-back','in-fwd','in-back');
  void st.offsetWidth;
  st.classList.add(pendingDir==='fwd'?'in-fwd':'in-back');
  pendingDir=null;
}

/* leave, swap, arrive */
function navigate(dir,apply){
  const st=document.getElementById('stage');
  if(view!=='object'||animating){apply();pendingDir=dir;render();return}
  animating=true;
  st.classList.remove('in-fwd','in-back','out-fwd','out-back');
  void st.offsetWidth;
  st.classList.add(dir==='fwd'?'out-fwd':'out-back');
  setTimeout(()=>{
    apply();pendingDir=dir;render();
    window.scrollTo({top:0,behavior:'smooth'});
    animating=false;
  },OUT_MS);
}

const ALLMODS='__all__';
let selMod=null;                         // current modality filter for the focused object
function modsFor(k){return N[k].mods||null}
function resetMod(){const m=modsFor(focusKey());selMod=m&&m.length?m[0]:null}
function visibleUnder(k){                // does this object apply under the selected modality?
  if(!selMod||selMod===ALLMODS)return true;
  const m=modsFor(k);
  return !m||m.includes(selMod);         // no declaration means it applies everywhere
}
const focusKey=()=>hist[ptr];
const cameFrom=()=>ptr>0?hist[ptr-1]:null;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const portrait=()=>document.body.classList.contains('port');

function edgeFor(otherKey,g){
  if(N[otherKey]&&N[otherKey].type==='measurement'&&g.edge==='HAS_DATA_ELEMENT')
    return {edge:'HAS_MEASUREMENT',phrase:g.subj==='other'?'measures':'is measured by'};
  return {edge:g.edge,phrase:g.phrase};
}

function sentence(otherKey,g){
  const f=N[focusKey()],o=N[otherKey];
  const e=edgeFor(otherKey,g);
  // name the type on each side so a same-named pair still reads unambiguously
  const part=(k,self)=>`<span class="relk" style="color:${C[N[k].type]}">${LABEL[N[k].type]}</span> `
    +(self?`<span class="self">${N[k].name}</span>`:`<b>${N[k].name}</b>`);
  const A=g.subj==='other'?part(otherKey,false):part(focusKey(),true);
  const B=g.subj==='other'?part(focusKey(),true):part(otherKey,false);
  return `<div class="rel"><span class="edgecode">${e.edge}</span>${A} <em>${e.phrase}</em> ${B}</div>`;
}

/* an assessment's categories live on its element; surface them in the preview */
function assessmentValues(key){
  const n=N[key];
  if(n.type!=='assessment')return null;
  const out=[];
  (n.right||[]).forEach(g=>(g.items||[]).forEach(k=>{
    if(N[k]&&N[k].values)N[k].values.forEach(v=>out.push(v));
  }));
  return out;
}

function tile(key,g,isCtx){
  const n=N[key],id=g.edge+':'+key;
  const auto=isCtx;
  const isOpen=openTiles.has(id)||(auto&&!closedTiles.has(id));
  const t=el('div','tile'+(isOpen?' open':'')+(isCtx?' ctx':''));
  t.style.setProperty('--type',C[n.type]);
  const h=el('button','tilehead');
  h.setAttribute('aria-expanded',isOpen);
  h.appendChild(el('span','tag',LABEL[n.type]));
  h.appendChild(el('span','nm',n.name));
  let meta=[];
  if(n.values)meta.push(n.values.length+' values');
  else if(n.type==='assessment'){const av=assessmentValues(key);if(av&&av.length)meta.push(av.length+' categories')}
  if(n.units)meta.push(n.units.join(', '));
  if(meta.length)h.appendChild(el('span','ct',meta.join(' · ')));

  if(n.scope&&n.scope.length){
    n.scope.forEach(x=>{
      const sk=typeof x==='string'?x:x.loc;
      if(N[sk])h.appendChild(el('span','anattag',N[sk].name));
    });
  }
  if(n.useTag)h.appendChild(el('span','usetag',n.useTag));
  h.appendChild(el('span','cv',isOpen?'▲':'▼'));
  h.onclick=()=>{if(isOpen){openTiles.delete(id);closedTiles.add(id)}else{openTiles.add(id);closedTiles.delete(id)}render()};
  if(isCtx){
    const cn=el('div','ctxrow');
    cn.appendChild(el('span','ctxnote','viewing from'));
    t.appendChild(cn);
  }
  t.appendChild(h);
  const bd=el('div','tilebody');
  bd.innerHTML=sentence(key,g);
  bd.appendChild(el('p',null,n.definition));
  const vs=n.values||assessmentValues(key);
  if(vs&&vs.length){
    const ch=el('div','chips');
    vs.forEach(v=>{
      if(!v.key){ch.appendChild(el('span','chip',v.name));return}
      const b=el('button','chip chiplink');
      b.textContent=v.name+(v.openNotes?' *':'');
      b.onclick=e=>{e.stopPropagation();goVia(key,v.key)};
      ch.appendChild(b);
    });
    bd.appendChild(ch);
  }
  else if(n.type==='assessment')bd.appendChild(el('div','vempty','No categories defined yet'));
  const ob=el('button','open-btn','Open '+n.name);
  ob.onclick=()=>go(key);
  const orow=el('div','open-row');orow.appendChild(ob);bd.appendChild(orow);
  t.appendChild(bd);return t;
}

function valueCards(vals){
  const w=el('div');
  vals.forEach(v=>{
    const c=el('button','val');
    if(v.key)c.onclick=()=>go(v.key);
    const vn=el('div','vn',v.name);
    if(v.openNotes)vn.appendChild(el('span','vfn','*'));
    c.appendChild(vn);
    c.appendChild(v.definition?el('div','vd',v.definition):el('div','vempty','No definition yet'));
    c.appendChild(el('div','vm',v.mappings&&v.mappings.length?v.mappings.map(m=>m[0]+' '+m[1]+(m[3]?' · '+m[3]:'')).join(' · '):'Not mapped'));
    w.appendChild(c);
  });
  return w;
}

  };
  if(g.label)w.appendChild(el('div','grouplabel',DYN[g.label]||g.label));
  const SUBS={
    'How it is described':`Attributes associated directly with ${n.name}`,
    'How it is assessed':'Established protocols for classifying, grading, and managing medical findings',
    'What it may mean':`Diagnoses that may be represented by ${n.name}. Together these are its differential considerations`,
    'Findings that support this diagnosis':'Findings that may be used to describe or support this diagnosis',
    'Parts of this':'Anatomic locations that carry associations with this anatomy',

    'Also used through subregions':`Not scoped to ${n.name} directly, but to a subregion of it. Reached by walking PART_OF`,
    'Also used through kinds':`Not scoped to ${n.name} directly, but to a kind of it. Reached by walking IS_A`,
    'Is part of':'Anatomic locations that contain this anatomy',
    'Is a':'Anatomic classes this anatomy belongs to'
  };
  if(SUBS[g.label])w.appendChild(el('div','groupsub',SUBS[g.label]));
  const REACH={
    'Parts of this':['region',`A search for <b>${n.name}</b> also returns findings placed in these subregions, and in anything beneath them.*`,
                     '* kind: region, walks PART_OF'],
    'Is part of':   ['region',`A search for any of these regions, or anything above them, also returns findings placed in <b>${n.name}</b>.*`,
                     '* kind: region, walks PART_OF'],
    'Kinds of this':['class',`A search for <b>${n.name}</b> also returns findings placed in these kinds, and in anything beneath them.*`,
                     '* kind: class, walks IS_A'],
    'Is a':         ['class',`A search for any of these classes, or anything above them, also returns findings placed in <b>${n.name}</b>.*`,
                     '* kind: class, walks IS_A']
  };
  const FOOT={'Often occurs with':'* Not listed in order of strength or frequency'};
  const rc=REACH[g.label];
  if(rc){
    const r=el('div','reach');
    r.appendChild(el('span','kindtag',rc[0]));
    r.appendChild(el('span','rt',rc[1]));
    w.appendChild(r);
    w.appendChild(el('div','reachfn',rc[2]));
  }
  if(g.headerOnly)return w;
  if(g.vals){w.appendChild(valueCards(n.values||[]));
    if(n.valuesOpen)w.appendChild(el('span','flag',n.valuesOpen))}
  else if(g.items&&g.items.length){
    let shown=side==='right'?g.items.filter(visibleUnder):g.items;
    // measurements read last among the descriptors
    if(g.edge==='HAS_DATA_ELEMENT')
      shown=shown.slice().sort((a,b)=>(N[a].type==='measurement')-(N[b].type==='measurement'));
    const hidden=g.items.length-shown.length;
    const from=cameFrom();
    let extra=0;
    if(g.max&&!shownAll.has(g.label)&&shown.length>g.max){
      extra=shown.length-g.max; shown=shown.slice(0,g.max);
    }
    shown.forEach(k=>w.appendChild(tile(k,g,side==='left'&&k===from)));
    if(extra){
      const more=el('button','moretoggle',extra+' more');
      more.onclick=()=>{shownAll.add(g.label);render()};
      w.appendChild(more);
    } else if(g.max&&shownAll.has(g.label)&&g.items.length>g.max){
      const less=el('button','moretoggle','Show fewer');
      less.onclick=()=>{shownAll.delete(g.label);render()};
      w.appendChild(less);
    }
    if(!shown.length)w.appendChild(el('div','empty','Nothing applies under '+selMod));
    else if(hidden)w.appendChild(el('div','extra',hidden+(hidden===1?' item does':' items do')+' not apply under '+selMod));
    if(g.extra)w.appendChild(el('div','extra',g.extra));
  } else w.appendChild(el('div','empty','Nothing yet'));
  if(g.open)w.appendChild(el('span','flag',g.open));
  if(g.add&&side==='right')w.appendChild(el('button','add','+ '+g.add));
  if(FOOT[g.label]&&g.items&&g.items.length)w.appendChild(el('div','groupfn',FOOT[g.label]));
  return w;
}

/* a referenced definition is read in the context of whatever pointed at it, and
   that nests: a value sits inside its element, which sits inside its finding.
   A Diagnosis is a root, so it is never shown in someone else's context.        */
function connected(fromKey,key){
  const f=N[fromKey];
  if(!f)return false;
  const inGroups=gs=>(gs||[]).some(g=>{
    if(g.vals)return (f.values||[]).some(v=>v.key===key);
    return (g.items||[]).includes(key);
  });
  if(inGroups(f.right)||inGroups(f.left))return true;
  if((f.scope||[]).some(x=>(typeof x==='string'?x:x.loc)===key))return true;
  if((f.maps||[]).includes(key))return true;
  if((f.values||[]).some(v=>v.key===key))return true;
  if((f.rawMaps||[]).some(m=>m[4]===key))return true;
  return false;
}

function qualifies(key,fromKey){
  if(!connected(fromKey,key))return false;
  const n=N[key],f=N[fromKey];
  if(!f||n.type==='diagnosis')return false;
  if(['element','measurement','assessment','value','anatomy','concept'].includes(n.type))return true;
  return n.type==='finding'&&f.type==='diagnosis';
}

const MAX_BANDS=4;
function contextBands(){
  const chain=[];
  for(let j=ptr;j>0&&chain.length<MAX_BANDS;j--){
    if(!qualifies(hist[j],hist[j-1]))break;
    chain.push(hist[j]);
  }
  if(!chain.length)return [];
  chain.push(hist[ptr-chain.length]);      // the object the chain started from
  chain.reverse();
  const out=[];
  chain.forEach((k,i)=>{
    out.push(bandLine(k,i));
    if(i<chain.length-1)out.push(verbLine(i));
  });
  return out;
}

  const SCOPED_TYPES=['finding','diagnosis','element','measurement','assessment','value'];
  const scopeEntries=(n.scope&&n.scope.length)?n.scope:null;
  let inheritedFrom=null, inheritedLoc=null;
  if(!scopeEntries&&SCOPED_TYPES.includes(n.type)){
    for(let j=ptr-1;j>=0;j--){
      const anc=N[hist[j]];
      if(anc&&anc.scope&&anc.scope.length){

    // regions at once, so no narrowing rule is stated for it
    const NARROWS={finding:'attributes',assessment:'attributes',element:'values'};
    const narrows=NARROWS[n.type];
    const KIND={
      specific:(f,k)=>`The context in which <b>${f}</b> is defined here is scoped to <b>${k}</b>.`
        +(narrows?` Its ${narrows} are generally expected to have same scope or be further narrowed to any anatomy that is a part of ${k} (soft enforcement).`:''),

        +(narrows?` Its ${narrows} are expected to be further scoped to any anatomy contained by ${k} (soft enforcement).`:''),
      class:   (f,k)=>`The context in which <b>${f}</b> is defined here is scoped to <b>${k}</b>.`
        +(narrows?` Its ${narrows} are expected to be further scoped to any anatomy classified under ${k} (soft enforcement).`:'')
    };
    const STRENGTH={
      required:['Required','The defined concept is expected to be sited here'],
      expected:['Expected','This concept as described here siting elsewhere is unusual'],
      unconstrained:['Unconstrained','No expectation is stated']
    };
    const parentsBy=(k,edge,word)=>{
      const out=[];

        if(g.edge===edge&&g.subj==='focus')(g.items||[]).forEach(x=>out.push([x,word]));
      });
      return out;
    };
    const chainBy=(k,edge,word)=>{              // one line upward, nearest parent first
      const line=[];let cur=k,guard=0;
      while(guard++<6){
        const ps=parentsBy(cur,edge,word); if(!ps.length)break;
        line.unshift(ps[0]); cur=ps[0][0];
      }
      return line;
    };
    const sayChain=(startName,chain)=>{
      const steps=[];
      for(let q=chain.length-1;q>=0;q--){
        const [pk,rel]=chain[q];
        const parent=N[pk]?N[pk].name:pk;
        steps.push(q===chain.length-1
          ? `<b>${startName}</b> ${rel} <b>${parent}</b>`
          : `${rel} <b>${parent}</b>`);
      }
      return steps.join(', which is ');
    };


    const ac=el('div','anatcard');
    ac.appendChild(el('div','hd','Anatomic scope'));
    ac.appendChild(el('div','sub','The anatomic context in which <b>'+n.name+'</b> is defined here, anchored to the anatomy hierarchy.'));
    if(!scopeEntries){
      ac.appendChild(el('div','inheritnote',
        'None. Not every object needs an anatomic reference. Where one applies, it can be narrowed by whatever references this object, if applicable.'));
      if(inheritedFrom&&N[inheritedLoc]){
        const l2=N[inheritedLoc];
        const dl3=el('dl');
        dl3.appendChild(el('dt',null,'Referenced by'));
        const d1=el('dd'); d1.appendChild(chip(inheritedFrom)); dl3.appendChild(d1);
        dl3.appendChild(el('dt',null,'Within'));
        const d2=el('dd');
        d2.appendChild(chip(inheritedLoc));
        d2.appendChild(el('span','orsub','or a subregion of it'));
        dl3.appendChild(d2);
        ac.appendChild(dl3);
      }
      const ar0=el('div','addrow');
      ar0.appendChild(el('button','miniadd','+ Add anatomic reference'));
      ac.appendChild(ar0);
    }

    (scopeEntries||[]).forEach(x=>{
      const k=typeof x==='string'?x:x.loc, loc=N[k];
      if(!loc)return;
      const block=el('div','scopeblock');
      const box=el('div','scope');
      const rm=el('button','scopex','\u00d7');
      rm.setAttribute('aria-label','Remove this anatomic reference');
      box.appendChild(rm);

      const partChain=chainBy(k,'PART_OF','is part of');
      const classChain=chainBy(k,'IS_A','is a');
      const chain=partChain.length?partChain:classChain;
      const crumb=el('div','crumb');
      chain.forEach(([pk])=>{
        const up=el('button','up',N[pk]?N[pk].name:pk);
        up.onclick=()=>go(pk);
        crumb.appendChild(up);
        crumb.appendChild(el('span','sepc','\u203a'));
      });
      const here=el('button','here',loc.name);
      here.onclick=()=>go(k);
      crumb.appendChild(here);
      block.appendChild(crumb);

      const bound=(loc.maps||[]).map(mk=>N[mk]).filter(Boolean)[0];
      const ref=el('div','anatref');
      if(bound){
        const codechip=el('button','codechip');
        codechip.innerHTML=`<b>${bound.system}</b> <code>${bound.id}</code>`;
        codechip.onclick=()=>go((loc.maps||[]).filter(mk=>N[mk])[0]);
        ref.appendChild(codechip);
        ref.appendChild(el('span','mapnote',
          bound.name+' \u00b7 '+bound.match+(bound.sourceVersion?' \u00b7 '+bound.system+' '+bound.sourceVersion:'')
          +(bound.primary?' \u00b7 primary':'')));
      } else {
        ref.appendChild(el('span','mapnote','Not bound to a terminology'));
      }
      block.appendChild(ref);

      // what the scope edge claims
      box.appendChild(el('div','seclabel','How this scope is matched'));
      const dlA=el('dl');
      const kd=KIND[x.kind], st=STRENGTH[x.strength];
      if(kd){dlA.appendChild(el('dt',null,'Match'));
             dlA.appendChild(el('dd',null,kd(n.name,loc.name)))}
      if(st){dlA.appendChild(el('dt',null,'Strength'));
             dlA.appendChild(el('dd',null,'<b>'+st[0]+'</b>. '+st[1]))}
      box.appendChild(dlA);
      box.appendChild(el('div','flag',
        'Strength is proposed to govern where the defined object is sited. '
        +'Whether a given scope is genuinely required is a case by case judgement. Mechanism not fully defined.'));

      // facts about the location itself
      box.appendChild(el('div','seclabel sec2','About '+loc.name));
      const dl2=el('dl');
      if(partChain.length){
        dl2.appendChild(el('dt',null,'Contained in'));
        dl2.appendChild(el('dd',null,sayChain(loc.name,partChain)));
      }
      if(classChain.length){
        dl2.appendChild(el('dt',null,'Classified as'));
        dl2.appendChild(el('dd',null,sayChain(loc.name,classChain)));
      }
      dl2.appendChild(el('dt',null,'Source<span class="fn">*</span>'));
      if(loc.source==='imported'){
        dl2.appendChild(el('dd',null,
          '<b>Imported</b>. Concept and hierarchy loaded from '+(loc.primarySystem||'RADLEX')
          +(bound&&bound.sourceVersion?' '+bound.sourceVersion:'')));
      } else {
        let t='<b>Held locally</b>. Not named by the source terminology';
        t+= loc.sourceStatus==='pending_request'&&loc.request ? '. Request '+loc.request+' open'
          : loc.sourceStatus==='local_only' ? '. Expected to stay local'
          : '. No request filed';
        dl2.appendChild(el('dd',null,t));
      }
      box.appendChild(dl2);
      block.appendChild(box);
      ac.appendChild(block);
    });

    if(scopeEntries){
      const ar=el('div','addrow');
      ar.appendChild(el('button','miniadd','+ Add anatomic reference'));
      ac.appendChild(ar);
    }
    if(scopeEntries)ac.appendChild(el('div','anatnote',
      '* Missing concepts can be added locally on a provisional basis while a change request is pending with RadLex.'));
    if(n.scopeOpen)ac.appendChild(el('span','flag',n.scopeOpen));
    const vl=el('div','vlink');
    vl.appendChild(el('div','ar',portrait()?'\u2194':'\u2195'));
    frow.appendChild(vl);
    frow.appendChild(ac);
  }
  return wrap;
}

/* ---------- views: object | search | browse | author | review ---------- */
let view='browse', query='', filter='finding', browseQuery='', sort='name', asc=true, statusFilter='all',
    pageSize=25, pageStart=0;
const TYPES=['diagnosis','finding','element','measurement','assessment','anatomy','concept'];
const FILTERS=['diagnosis','finding','element','measurement'];

function setView(v){
  view=v;
  document.querySelectorAll('#mainnav button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.view===v));
  render();
}

function matches(k){
  const n=N[k];
  if(n.type==='value')return false;
  if(statusFilter!=='all'&&n.status!==statusFilter)return false;
  if(filter!=='all'&&n.type!==filter)return false;
  if(!query)return true;
  const q=query.toLowerCase();
  const syn=(n.synonyms||[]).map(x=>x[0]).join(' ');
  return (n.name+' '+(n.definition||'')+' '+syn+' '+n.id).toLowerCase().includes(q);
}

function resultRow(k){
  const n=N[k],b=el('button','result');
  b.style.setProperty('--type',C[n.type]);
  b.appendChild(el('span','tag',LABEL[n.type]));
  const body=el('div','body');
  const nm=el('div','nm');
  nm.appendChild(el('span',null,n.name));
  if(n.scope&&n.scope.length)
    n.scope.forEach(x=>{const sk=typeof x==='string'?x:x.loc;if(N[sk])nm.appendChild(el('span','anat',N[sk].name))});
  body.appendChild(nm);
  body.appendChild(el('div','sn',n.definition||''));
  b.appendChild(body);
  const rec=el('div','recmeta');
  if(n.id)rec.appendChild(el('span','rid',n.id));
  if(n.version)rec.appendChild(el('span','rv','v'+n.version));
  if(n.status)rec.appendChild(el('span','rs '+n.status,n.status));
  if(n.uses>1)rec.appendChild(el('span','ru','used in '+n.uses));
  b.appendChild(rec);
  b.onclick=()=>{hist=[k];ptr=0;openTiles.clear();closedTiles.clear();shownAll.clear();trailCollapsed=false;resetMod();setView('object')};
  return b;
}

function renderPanel(){
  const p=document.getElementById('panel');
  p.innerHTML='';p.hidden=false;
  document.getElementById('stage').hidden=true;

  const searching = view==='search';
  p.appendChild(el('h2',null,searching?'Search':'Browse repository'));
  if(searching)p.appendChild(el('p','sub',
    query?`Results for “${query}”`:'Type to search across the repository.'));

  if(!searching){
    const bar=el('div','panelbar');
    const sb=el('div','searchbox');
    sb.appendChild(el('span','mag','⌕'));
    const bi=document.createElement('input');
    bi.type='search';bi.placeholder='Narrow this list';bi.value=browseQuery;
    bi.setAttribute('aria-label','Narrow the browse list');
    bi.addEventListener('input',()=>{browseQuery=bi.value.trim();pageStart=0;render();
      const again=document.querySelector('.panelbar input');if(again){again.focus();
        again.setSelectionRange(again.value.length,again.value.length)}});
    sb.appendChild(bi);bar.appendChild(sb);
    const sg=el('div','sortgroup');
    const sm=(val,label)=>{const b=el('button',null,label);
      b.setAttribute('aria-pressed',sort===val);b.onclick=()=>{sort=val;pageStart=0;render()};return b};
    sg.appendChild(sm('name','Alphabetical'));
    sg.appendChild(sm('type','By type'));
    bar.appendChild(sg);
    const dg=el('div','sortgroup');
    const dm=(val,label)=>{const b=el('button',null,label);
      b.setAttribute('aria-pressed',asc===val);b.onclick=()=>{asc=val;pageStart=0;render()};return b};
    dg.appendChild(dm(true,'A \u2192 Z'));
    dg.appendChild(dm(false,'Z \u2192 A'));
    bar.appendChild(dg);
    const st=el('div','sortgroup');
    const sf=(val,label)=>{const b=el('button',null,label);
      b.setAttribute('aria-pressed',statusFilter===val);
      b.onclick=()=>{statusFilter=val;pageStart=0;render()};return b};
    st.appendChild(sf('all','Any status'));
    st.appendChild(sf('draft','Draft'));
    st.appendChild(sf('proposed','Proposed'));
    st.appendChild(sf('published','Published'));
    st.appendChild(sf('retired','Retired'));
    bar.appendChild(st);
    p.appendChild(bar);
  }

  const f=el('div','filters');
  const mk=(val,label)=>{const b=el('button',null,label);
    b.setAttribute('aria-pressed',filter===val);
    b.onclick=()=>{filter=val;pageStart=0;render()};return b};
  FILTERS.forEach(t=>f.appendChild(mk(t,LABEL[t])));
  f.appendChild(mk('all','All'));
  p.appendChild(f);

  let keys=Object.keys(N).filter(matches);
  if(!searching&&browseQuery){
    const bq=browseQuery.toLowerCase();
    keys=keys.filter(k=>(N[k].name+' '+(N[k].definition||'')).toLowerCase().includes(bq));
  }
  if(!keys.length){p.appendChild(el('div','noresult','Nothing matches that yet.'));return}

  const byName=(a,b)=>(asc?1:-1)*N[a].name.localeCompare(N[b].name);
  const total=keys.length;
  if(pageStart>=total)pageStart=0;
  const stop=Math.min(pageStart+pageSize,total);

  const pager=(where)=>{
    const row=el('div','pager '+where);
    row.appendChild(el('span','count',
      `Displaying <b>${pageStart+1}</b> to <b>${stop}</b> of <b>${total}</b>`));
    const nav=el('div','pagenav');
    const prev=el('button','pagebtn','\u2039 Previous');
    prev.disabled=pageStart===0;
    prev.onclick=()=>{pageStart=Math.max(0,pageStart-pageSize);render()};
    const next=el('button','pagebtn','Next \u203a');
    next.disabled=stop>=total;
    next.onclick=()=>{pageStart=stop;render()};
    nav.appendChild(prev);nav.appendChild(next);
    if(where==='top'){
      const sel=document.createElement('select');
      sel.className='pagesize';
      sel.setAttribute('aria-label','Results per page');
      [10,25,50,100].forEach(v=>{
        const o=document.createElement('option');
        o.value=v;o.textContent=v+' per page';
        if(v===pageSize)o.selected=true;
        sel.appendChild(o);
      });
      sel.onchange=()=>{pageSize=+sel.value;pageStart=0;render()};
      nav.appendChild(sel);
    }
    row.appendChild(nav);
    return row;
  };

  const bw=el('div','browsewrap');
  p.appendChild(bw);
  bw.appendChild(pager('top'));

  if(searching||sort==='name'){
    const page=keys.sort(byName).slice(pageStart,stop);
    const list=el('div','results');
    page.forEach(k=>list.appendChild(resultRow(k)));
    bw.appendChild(list);
  } else {
    // group headings run alphabetically too, and flip with the direction toggle
    const page=keys.sort((a,b)=>{
      const ti=(asc?1:-1)*LABEL[N[a].type].localeCompare(LABEL[N[b].type]);
      return ti||byName(a,b);
    }).slice(pageStart,stop);
    let last=null;
    let list=null;
    page.forEach(k=>{
      if(N[k].type!==last){
        last=N[k].type;
        bw.appendChild(el('div','grouphd',LABEL[last]));
        list=el('div','results');bw.appendChild(list);
      }
      list.appendChild(resultRow(k));
    });
  }

  bw.appendChild(pager('bottom'));
}

/* everything scoped to a location beneath this one, the result of the region
   and class searches described on the right                                   */
function descendantsOf(key,edge){
  const out=[],seen=new Set();
  const walk=(k,path)=>{
    ((N[k]||{}).right||[]).forEach(g=>{
      if(g.edge===edge&&g.subj==='other')
        (g.items||[]).forEach(c=>{
          if(seen.has(c))return;
          seen.add(c);
          const p=path.concat(c);
          out.push([c,p]);
          walk(c,p);
        });
    });
  };
  walk(key,[key]);
  return out;
}

function indirectByPath(key,edge){
  const direct=new Set();
  ((N[key]||{}).left||[]).forEach(g=>{
    if(g.usage&&g.edge==='SCOPED_TO')(g.items||[]).forEach(x=>direct.add(x));
  });
  const paths=[],seen=new Set();
  descendantsOf(key,edge).forEach(([d,route])=>{
    const users=[];
    ((N[d]||{}).left||[]).forEach(g=>{
      if(g.usage&&g.edge==='SCOPED_TO')(g.items||[]).forEach(x=>{
        if(!direct.has(x)&&!seen.has(x)){seen.add(x);users.push(x)}
      });
    });
    if(users.length)paths.push([d,users,route]);
  });
  return paths;
}

function render(){
  if(view!=='object'){renderPanel();return}
  document.getElementById('panel').hidden=true;
  document.getElementById('stage').hidden=false;
  const n=N[focusKey()];
  const L=document.getElementById('left'),M=document.getElementById('mid'),R=document.getElementById('right');
  L.innerHTML='';M.innerHTML='';R.innerHTML='';
  L.appendChild(el('div','colhead','Wider context'));
  const from=cameFrom();
  const isUp=g=>(g.edge==='PART_OF'||g.edge==='IS_A')&&g.subj==='focus';
  const upGroups=(n.left||[]).filter(isUp);
  (n.left||[]).filter(g=>!isUp(g)).forEach(g=>{
    if(g.usage){
      const t=LABEL[n.type];
      if(from&&g.items.includes(from)){
        L.appendChild(group(Object.assign({},g,{label:t+' used by',items:[from],extra:null}),'left'));
        const rest=g.items.filter(k=>k!==from);
        L.appendChild(group(Object.assign({},g,{label:'Other uses of this '+t,items:rest}),'left'));
      } else {
        L.appendChild(group(Object.assign({},g,{label:t+' used by'}),'left'));
      }
      // and everything reached by walking the hierarchy beneath this location
      if(g.edge==='SCOPED_TO'&&n.type==='anatomy'){
        [['PART_OF','Also used through subregions'],['IS_A','Also used through kinds']].forEach(([e,lab])=>{
          const paths=indirectByPath(focusKey(),e);
          if(!paths.length)return;
          L.appendChild(group({label:lab,headerOnly:true},'left'));
          paths.forEach(([d,users,route])=>{
            const box=el('div','pathgroup');
            const rc=el('div','pathcrumb');
            route.forEach((step,ix)=>{
              if(ix)rc.appendChild(el('span','sepc','\u203a'));
              const b=el('button',ix===route.length-1?'laststep':'step',N[step].name);
              b.onclick=()=>go(step);
              rc.appendChild(b);
            });
            box.appendChild(rc);
            box.appendChild(group({label:null,edge:'SCOPED_TO',
              phrase:'occurs in',subj:'other',items:users,max:10},'left'));
            L.appendChild(box);
          });
        });
      }
      return;
    }
    L.appendChild(group(g,'left'));
  });
  if(!(n.left||[]).filter(g=>!isUp(g)).length)L.appendChild(el('div','empty','No content'));
  M.appendChild(renderFocus());
  R.appendChild(el('div','colhead','Detail'));
  upGroups.forEach(g=>R.appendChild(group(g,'right')));
  (n.right||[]).forEach(g=>R.appendChild(group(g,'right')));
  if(!upGroups.length&&!(n.right||[]).length)R.appendChild(el('div','empty','Nothing yet'));

  document.getElementById('s1').firstChild.textContent=portrait()?'↕':'↔';
  document.getElementById('s2').firstChild.textContent=portrait()?'↕':'↔';
  requestAnimationFrame(centreSeps);
  playTransition();
}

function centreSeps(){
  const mid=document.getElementById('mid'),card=mid.querySelector('.focus');
  const s1=document.getElementById('s1'),s2=document.getElementById('s2');
  if(portrait()||!card){[s1,s2].forEach(s=>{s.style.height='';s.style.paddingTop=''});return}
  const midTop=mid.getBoundingClientRect().top,r=card.getBoundingClientRect();
  const centre=(r.top+r.height/2)-midTop;
  [s1,s2].forEach(s=>{s.style.paddingTop='0px';s.style.height=(centre*2)+'px'});
}

/* open a value from a tile: step through its element so the chain reads in full */
function goVia(midKey,leafKey){
  if(focusKey()!==midKey){
    hist=hist.slice(0,ptr+1);hist.push(midKey);ptr=hist.length-1;
  }
  go(leafKey);
}

function go(key){
  if(key===focusKey())return;
  navigate(directionTo(key),()=>{
    hist=hist.slice(0,ptr+1);hist.push(key);ptr=hist.length-1;
    openTiles.clear();closedTiles.clear();shownAll.clear();trailCollapsed=false;resetMod();
  });
}

function setOrient(m){
  document.body.classList.toggle('land',m==='land');
  document.body.classList.toggle('port',m==='port');
  document.getElementById('bl').setAttribute('aria-pressed',m==='land');
  document.getElementById('bp').setAttribute('aria-pressed',m==='port');
  render();
}
document.getElementById('bl').onclick=()=>setOrient('land');
document.getElementById('bp').onclick=()=>setOrient('port');
window.addEventListener('resize',centreSeps);

document.querySelectorAll('#mainnav button').forEach(b=>{
  b.onclick=()=>{ if(b.dataset.view==='browse'){query='';document.getElementById('q').value=''} setView(b.dataset.view) };
});
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{
  query=qEl.value.trim();pageStart=0;
  if(query){ if(view!=='search'){view='search';document.querySelectorAll('#mainnav button').forEach(b=>b.setAttribute('aria-current',false))} render(); }
  else if(view==='search'){ setView('object') }
});

resetMod();
setView('browse');
setOrient(window.innerWidth<920?'port':'land');
</script>
