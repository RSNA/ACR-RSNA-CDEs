<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="system-ui, sans-serif" role="img"
     aria-label="Five FindingClasses all binding the single shared presence DataElement node — reuse as edge in-degree.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>

  <!-- trunk and branches -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="270" y1="64"  x2="470" y2="64"/>
    <line x1="270" y1="130" x2="470" y2="130"/>
    <line x1="270" y1="196" x2="470" y2="196"/>
    <line x1="270" y1="262" x2="470" y2="262"/>
    <line x1="270" y1="328" x2="470" y2="328"/>
    <line x1="470" y1="64"  x2="470" y2="328"/>
    <line x1="470" y1="196" x2="616" y2="196" marker-end="url(#arr)"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="470" cy="64" r="3"/><circle cx="470" cy="130" r="3"/><circle cx="470" cy="196" r="3"/>
    <circle cx="470" cy="262" r="3"/><circle cx="470" cy="328" r="3"/>
  </g>
  <text x="543" y="186" text-anchor="middle" font-size="11" fill="#475569">HAS_ELEMENT</text>

  <!-- classes -->
  <g font-size="13" font-weight="600" fill="#1e3a8a">
    <rect x="70" y="40"  width="200" height="48" rx="9" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
    <text x="86" y="69">pulmonary nodule</text>
    <rect x="70" y="106" width="200" height="48" rx="9" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
    <text x="86" y="135">thyroid nodule</text>
    <rect x="70" y="172" width="200" height="48" rx="9" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
    <text x="86" y="201">pleural effusion</text>
    <rect x="70" y="238" width="200" height="48" rx="9" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
    <text x="86" y="267">ovarian cyst</text>
    <rect x="70" y="304" width="200" height="48" rx="9" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
    <text x="86" y="333">bone lesion</text>
  </g>
  <text x="70" y="388" font-size="11" fill="#94a3b8">… ~10,000 FindingClasses at ambition</text>

  <!-- shared element -->
  <rect x="620" y="166" width="230" height="60" rx="9" fill="#dcfce7" stroke="#166534" stroke-width="1.8"/>
  <text x="638" y="192" font-size="14" font-weight="700" fill="#14532d">presence</text>
  <text x="638" y="212" font-size="10" fill="#166534">DataElement — one node, one identity</text>

  <g font-size="11" fill="#475569">
    <text x="620" y="268">Reuse is in-degree: fix the definition on this node and</text>
    <text x="620" y="284">every class that binds it is fixed. No copies exist, so the</text>
    <text x="620" y="300">file-era copy-on-reference question disappears.</text>
    <text x="620" y="330" fill="#94a3b8">size (3D), change from prior, and the other canonical</text>
    <text x="620" y="346" fill="#94a3b8">elements are shared the same way.</text>
  </g>
</svg>
